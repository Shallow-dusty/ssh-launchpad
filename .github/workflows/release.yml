name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -exclude-generated -severity high ./...
      - run: shellcheck scripts/bootstrap.sh scripts/new-offline-pack.sh "packaging/launchers/Start SSH Launchpad.command"
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cli:
    needs: quality
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build and package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$GOOS" in windows) display_os=Windows;; linux) display_os=Linux;; darwin) display_os=macOS;; esac
          case "$GOARCH" in amd64) display_arch=x64;; arm64) display_arch=ARM64;; esac
          name="SSH-Launchpad_${version}_${display_os}_${display_arch}_Portable"
          mkdir -p "stage/${name}/profiles"
          go build -trimpath -ldflags="-s -w -X github.com/Shallow-dusty/ssh-launchpad/internal/launchpad.Version=${version}" -o "stage/${name}/ssh-launchpad${{ matrix.ext }}" ./cmd/ssh-launchpad
          cp LICENSE README.md CHANGELOG.md "stage/${name}/"
          cp profiles/*.yaml "stage/${name}/profiles/"
          cp docs/offline-help.zh-CN.md "stage/${name}/离线帮助-中文.md"
          cp docs/offline-help.en.md "stage/${name}/Offline Help - English.md"
          cp docs/offline-pack.md scripts/new-offline-pack.ps1 scripts/new-offline-pack.sh "stage/${name}/"
          if [[ "$GOOS" == windows ]]; then
            cp "packaging/launchers/开始使用 SSH Launchpad.cmd" "packaging/launchers/Start SSH Launchpad.cmd" "stage/${name}/"
          elif [[ "$GOOS" == darwin ]]; then
            cp "packaging/launchers/Start SSH Launchpad.command" "stage/${name}/"
            chmod +x "stage/${name}/Start SSH Launchpad.command" "stage/${name}/ssh-launchpad"
          else
            cp packaging/launchers/ssh-launchpad.desktop "stage/${name}/"
            chmod +x "stage/${name}/ssh-launchpad"
          fi
          manifest="$(mktemp)"
          (
            cd "stage/${name}"
            find . -type f -print0 | sort -z | xargs -0 sha256sum | sed 's|  \./|  |'
          ) > "$manifest"
          mv "$manifest" "stage/${name}/bundle-checksums.txt"
          if [[ "$GOOS" == windows ]]; then
            cd stage
            zip -qr "../${name}.zip" "${name}"
          else
            tar -C stage -czf "${name}.tar.gz" "${name}"
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: SSH-Launchpad_*.*
          if-no-files-found: error

  bootstrap:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Package standalone bootstraps
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="ssh-launchpad_${version}_bootstrap"
          mkdir -p "${name}/profiles"
          cp scripts/bootstrap.ps1 scripts/bootstrap.sh scripts/new-offline-pack.ps1 scripts/new-offline-pack.sh LICENSE README.md "${name}/"
          cp docs/offline-help.zh-CN.md docs/offline-help.en.md docs/offline-pack.md "${name}/"
          cp profiles/*.yaml "${name}/profiles/"
          zip -qr "${name}.zip" "${name}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bootstrap
          path: ssh-launchpad_*_bootstrap.zip

  desktop-windows:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install build tools
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          choco install nsis -y --no-progress
          $nsisDirectory = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          $makeNSIS = Join-Path $nsisDirectory 'makensis.exe'
          if (-not (Test-Path -LiteralPath $makeNSIS)) { throw "makensis.exe missing at $makeNSIS" }
          & $makeNSIS /VERSION
          $nsisDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Audit frontend dependencies
        working-directory: frontend
        run: pnpm audit --audit-level high
      - name: Install test dependencies
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.7.1 -Force -Scope CurrentUser
          pnpm --dir frontend exec playwright install chromium
      - name: Script and browser tests
        shell: pwsh
        run: |
          Invoke-Pester -Path tests -CI
          pnpm --dir frontend run build
          pnpm --dir frontend run test:e2e
      - name: Build validated user-scope installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          ./scripts/build-windows-installer.ps1 -Version $version
          $installer = Get-ChildItem build/bin -Filter '*installer.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer missing' }
          Copy-Item $installer.FullName "SSH-Launchpad_${version}_Windows_x64_Installer_UNSIGNED.exe"
      - name: Download and verify previous stable installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName,isDraft,isPrerelease |
              ConvertFrom-Json
          $baseRelease = $releases |
              Where-Object { -not $_.isDraft -and -not $_.isPrerelease -and $_.tagName -ne $env:GITHUB_REF_NAME } |
              Select-Object -First 1
          if (-not $baseRelease) { throw 'A previous stable installer is required for the upgrade smoke.' }
          $baseVersion = $baseRelease.tagName.TrimStart('v')
          $upgradeVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          $baseAsset = "SSH-Launchpad_${baseVersion}_Windows_x64_Installer_UNSIGNED.exe"
          New-Item -ItemType Directory -Path upgrade-base | Out-Null
          gh release download $baseRelease.tagName --repo $env:GITHUB_REPOSITORY --pattern $baseAsset --dir upgrade-base
          if ($LASTEXITCODE -ne 0) { throw "Could not download $baseAsset." }
          gh release download $baseRelease.tagName --repo $env:GITHUB_REPOSITORY --pattern checksums.txt --dir upgrade-base
          if ($LASTEXITCODE -ne 0) { throw "Could not download checksums.txt for $($baseRelease.tagName)." }
          $checksumLine = @(
              Get-Content -LiteralPath (Join-Path upgrade-base checksums.txt) |
                  Where-Object { $_ -match ('^[0-9A-Fa-f]{64}\s+\*?' + [regex]::Escape($baseAsset) + '$') }
          )
          if ($checksumLine.Count -ne 1) { throw "A unique checksum for $baseAsset was not found." }
          $expected = ([regex]::Match($checksumLine[0], '^([0-9A-Fa-f]{64})')).Groups[1].Value.ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath (Join-Path upgrade-base $baseAsset) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Checksum mismatch for $baseAsset." }
          Set-Content -LiteralPath upgrade-base/base-version.txt -Value $baseVersion -NoNewline
          Set-Content -LiteralPath upgrade-base/base-asset.txt -Value $baseAsset -NoNewline
      - name: Run verified upgrade smoke without repository credentials
        shell: pwsh
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          $baseVersion = (Get-Content -LiteralPath upgrade-base/base-version.txt -Raw).Trim()
          $baseAsset = (Get-Content -LiteralPath upgrade-base/base-asset.txt -Raw).Trim()
          $upgradeVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          ./tests/installer-upgrade-smoke.ps1 `
              -BaseInstaller (Join-Path upgrade-base $baseAsset) `
              -UpgradeInstaller "SSH-Launchpad_${upgradeVersion}_Windows_x64_Installer_UNSIGNED.exe" `
              -BaseVersion $baseVersion `
              -UpgradeVersion $upgradeVersion
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-windows
          path: SSH-Launchpad_*_Windows_x64_Installer_UNSIGNED.exe
          if-no-files-found: error

  publish:
    needs: [cli, bootstrap, desktop-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          artifact-name: ssh-launchpad.spdx.json
          output-file: release-assets/ssh-launchpad.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate checksums
        working-directory: release-assets
        run: |
          sha256sum ./* | sort -k2 | sed 's|  \./|  |' > checksums.txt
      - name: Package smoke
        shell: pwsh
        run: ./tests/package-smoke.ps1 -Path ./release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes_file=".github/release-notes-${GITHUB_REF_NAME}.md"
          if [[ ! -f "$notes_file" ]]; then
            echo "::error file=$notes_file::Release notes are required for tag $GITHUB_REF_NAME"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --title "SSH Launchpad $GITHUB_REF_NAME" \
            --notes-file "$notes_file"
