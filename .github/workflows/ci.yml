name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test ./...
      - run: go vet ./...
      - name: Build CLI
        run: go build -trimpath ./cmd/ssh-launchpad

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
      - name: Note
        run: |
          echo "govulncheck fails the job only on vulnerabilities reachable from this code."
          echo "Informational advisories in required-but-uncalled modules are reported in the log but do not fail CI."

  scripts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kind: shell
          - os: windows-latest
            kind: powershell
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install ShellCheck
        if: matrix.kind == 'shell'
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: matrix.kind == 'shell'
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: ShellCheck
        if: matrix.kind == 'shell'
        run: shellcheck scripts/bootstrap.sh scripts/new-offline-pack.sh "packaging/launchers/Start SSH Launchpad.command"
      - name: Generated Unix command semantics
        if: matrix.kind == 'shell'
        run: go test ./internal/launchpad -run TestGeneratedUnixCommandSyntaxAndShellCheck -count=1
      - name: Install Pester
        if: matrix.kind == 'powershell'
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.7.1 -Force -Scope CurrentUser
      - name: Pester
        if: matrix.kind == 'powershell'
        shell: pwsh
        run: Invoke-Pester -Path tests -CI

  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Audit frontend dependencies
        working-directory: frontend
        run: pnpm audit --audit-level high
      - name: Typecheck and build
        working-directory: frontend
        run: pnpm run build
      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install chromium
      - name: Browser E2E
        working-directory: frontend
        run: pnpm run test:e2e
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Build desktop
        run: wails build -clean -platform windows/amd64
      - name: Upload Windows desktop build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-desktop-build
          path: build/bin/
          if-no-files-found: error
