schemaVersion: 1
name: example-tailnet-host

target:
  platform: auto

ssh:
  enabled: true
  port: 2222
  publicKeys:
    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEB example-replace-with-controller-key
  passwordAuthentication: false

transport:
  mode: tailnet
  install: false
  # Optional tskey-auth- key for unattended tailnet join during Apply.
  # Keep it secret: it is stripped from exported profiles and reports.
  authKey: ""

exposure:
  mode: tailnet
  customCidrs: []

download:
  strategy: official
  mirrorBaseUrl: ""
  proxyUrl: ""
  offlineBundle: ""
  offlineSha256: ""
  cacheDir: ""
  retries: 3

safety:
  confirmHighRisk: true
  preventSelfCut: true
  scheduledDelaySeconds: 20
  autoRollback: true

advanced:
  windowsSshService: sshd
  linuxSshService: auto
  macosSshLabel: com.openssh.sshd
  stateDir: ""

labels:
  environment: example
